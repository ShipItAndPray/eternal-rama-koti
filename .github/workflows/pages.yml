name: pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache-bust every script and stylesheet with the commit sha
        run: |
          V="${GITHUB_SHA::12}"
          sed -i "s#src=\"app.js\"#src=\"app.js?v=$V\"#; s#href=\"style.css\"#href=\"style.css?v=$V\"#" web/index.html
          sed -i "s#from \"./config.js\"#from \"./config.js?v=$V\"#; s#from \"./glyphs.js\"#from \"./glyphs.js?v=$V\"#; s#from \"./typing.js\"#from \"./typing.js?v=$V\"#; s#from \"./vendor/viem.js\"#from \"./vendor/viem.js?v=$V\"#" web/app.js
          grep -c "?v=$V" web/index.html web/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
